# yaml-language-server: $schema=https://json.schemastore.org/traefik-v2-file-provider.json

tls:
  stores:
    default:
      # Environment-based certificate selection
      # For local/dev: uses defaultCertificate with local files
      # For staging/prod: uses defaultGeneratedCert with Let's Encrypt
      {{ if eq (env "TLS_MODE") "local" }}
      defaultCertificate:
        certFile: '/certs/traefik-selfsigned.crt'
        keyFile: '/certs/traefik-selfsigned.key'
      {{ else }}
      defaultGeneratedCert:
        domain:
          main: '{{ env "HOSTNAME_TLD" }}'
          sans:
            - '*.{{ env "HOSTNAME_TLD" }}'
        resolver: '{{ env "TLS_RESOLVER" | default "letsencrypt-staging" }}'
      {{ end }}


      