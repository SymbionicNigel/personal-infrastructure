# yaml-language-server: $schema=https://json.schemastore.org/traefik-v2.json

# Example traefik.yml file
# https://raw.githubusercontent.com/traefik/traefik/v3.1/traefik.sample.yml

api:
  dashboard: true

certificatesResolvers:
  letsencrypt-prod:
    acme:
      caServer: 'https://acme-v02.api.letsencrypt.org/directory'
      certificatesDuration: 2160
      dnsChallenge:
        delayBeforeCheck: '0'
        provider: linode
      email: '{{ env "HTTPS_EMAIL" }}'
      storage: '/letsencrypt/acme-prod.json'
  letsencrypt-staging:
    acme:
      caServer: 'https://acme-staging-v02.api.letsencrypt.org/directory'
      certificatesDuration: 2160
      dnsChallenge:
        delayBeforeCheck: '0'
        provider: linode
      email: '{{ env "HTTPS_EMAIL" }}'
      storage: '/letsencrypt/acme-staging.json'
      


entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          permanent: true
          scheme: 'https'
          to: 'websecure'
  websecure:
    address: :443

global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  format: json
  level: ERROR

providers:
  docker:
    defaultRule: 'Host(`{{ normalize .ContainerName }}.{{ env "HOSTNAME_TLD" }}`)'
    exposedByDefault: False
  file:
    filename: '/etc/traefik/dynamic.yml'
    watch: True



