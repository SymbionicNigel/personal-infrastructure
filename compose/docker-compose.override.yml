# Local-only override on top of docker-compose.yml. Auto-loaded by
# `docker compose up` — no -f flag needed. Not consumed in prod
# because Terraform inlines docker-compose.yml via templatefile() and
# passes raw content to Dokploy.
#
# Responsibilities:
#   - Expose each service on a host port so localhost works without
#     a reverse proxy.
#   - Flip dokploy-network to non-external so Compose creates it
#     locally (in prod, Dokploy creates it before stack deploy).
#
# To wire up a new service locally:
#   - Image-only services (e.g. janus): add a `ports:` mapping that
#     matches the container port in the service's loadbalancer label.
#   - Source-built services (e.g. astarte): add `build` (with the
#     Dockerfile's dev target), a local `image:` tag, `ports:`, and a
#     `volumes:` source bind mount for live reload.

networks:
  dokploy-network:
    external: false
    name: dokploy-network

services:
  astarte:
    build:
      context: ../astarte
      target: dev
    image: astarte:dev
    ports:
      - '8000:8000'
    volumes:
      # Host source bind-mounted over the editable install path so
      # `uvicorn --reload` (set as the dev CMD) picks up edits without
      # rebuilding the image.
      - ../astarte/src:/app/src

  iris:
    build:
      context: ../iris
      target: dev
    image: iris:dev
    ports:
      - '3000:3000'
    volumes:
      # Host source bind-mounted over /app/app so `react-router dev` HMR picks
      # up edits without rebuilding (node_modules + styled-system stay in the
      # image). Traefik redirect labels are inert locally (no local proxy).
      - ../iris/app:/app/app

  janus:
    ports:
      - '8080:80'
