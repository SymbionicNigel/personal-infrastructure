# One build at a time per ref (queued, not cancelled) so concurrent pushes
# don't race to set ASTARTE_IMAGE_TAG / push :latest out of order.
concurrency:
  cancel-in-progress: false
  group: astarte-${{ github.ref }}

jobs:
  # Single required status check for branch protection. Always runs (even when
  # test/build skipped) so it always reports, and fails only if a triggered job
  # actually failed -- an unrelated PR (test/build skipped) passes it, a broken
  # service PR blocks. skipped/cancelled are not failures.
  astarte-gate:
    if: ${{ always() }}
    needs: [changes, test, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A triggered job failed: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: |
          echo "ok: ${{ join(needs.*.result, ', ') }}"

  # Build the image via the reusable workflow. On master it also pushes to GHCR
  # and records ASTARTE_IMAGE_TAG; deploys then flow through deploy.yml
  # (workflow_run after this build), which renders the full compose from every
  # <SVC>_IMAGE_TAG Variable. On pull_request push_image is false: the image is
  # built for validation but not pushed, and the shared Variable isn't touched.
  build-and-push:
    if: ${{ needs.changes.outputs.astarte == 'true' }}
    needs: [changes, test]
    secrets: inherit
    uses: ./.github/workflows/_build-push.yml
    with:
      context: astarte
      push_image: ${{ github.event_name != 'pull_request' }}
      service: astarte

  # Detect whether the service's own code/build config changed. On non-PR events
  # the filter is skipped and defaults to true (push/dispatch always do the work).
  # Lets the workflow trigger on every PR while the real jobs skip when astarte/
  # is untouched -- so the required astarte-gate never deadlocks an unrelated PR
  # (a non-reporting required check blocks merge; a skipped one does not).
  changes:
    outputs:
      astarte: ${{ steps.filter.outputs.astarte || 'true' }}
    runs-on: ubuntu-latest
    steps:
      - id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            astarte:
              - 'astarte/**'
              - '.github/workflows/astarte.yml'

  test:
    defaults:
      run:
        working-directory: astarte
    if: ${{ needs.changes.outputs.astarte == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-dependency-glob: astarte/uv.lock
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run ruff check

      - run: uv run ruff format --check

      - run: uv run pytest

      # Fail the build if any dep ships under a non-permissive license.
      # The repo is Apache-2.0; copyleft (GPL/AGPL) and source-available
      # (SSPL/BUSL) deps would create distribution conflicts.
      # List carries both classifier and SPDX spellings (e.g. "MIT
      # License" and "MIT") plus compound SPDX exprs ("X OR Y").
      - name: license audit
        run: >
          uv run pip-licenses --allow-only='Apache Software
          License;Apache 2.0;Apache-2.0;BSD
          License;BSD-2-Clause;BSD-3-Clause;0BSD;ISC License
          (ISCL);ISC;MIT License;MIT;Mozilla Public License 2.0 (MPL
          2.0);MPL-2.0;Python Software Foundation
          License;PSF-2.0;The Unlicense (Unlicense);Unlicense;Apache-2.0
          OR BSD-2-Clause'

name: astarte

on:
  # Runs on every PR so the required astarte-gate always reports; the `changes`
  # job + per-job `if` skip the real work when astarte/ is untouched. Push stays
  # path-filtered: master only rebuilds/pushes when the service actually changes.
  pull_request:
  push:
    branches: [master]
    paths:
      - 'astarte/**'
      - '.github/workflows/astarte.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read
