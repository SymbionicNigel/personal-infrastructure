# Required repo secrets (via `secrets: inherit`):
#   GPG_PRIVATE_KEY
#   BW_CLIENTID, BW_CLIENTSECRET, BW_PASSWORD
#   CI_PAT  (reads the private .secrets submodule)
#   GHCR_PAT  (Dokploy's GHCR pull credential)

concurrency:
  cancel-in-progress: false
  group: linode-tf-apply

jobs:
  apply:
    environment: ${{ inputs.label }}
    if: ${{ !inputs.plan_only && needs.plan.outputs.has_changes == 'true' }}
    needs: plan
    runs-on: ubuntu-26.04
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - &setup
        name: Setup (submodules, GPG, chezmoi, Terraform)
        uses: ./.github/actions/tf-setup
        with:
          bw_clientid: ${{ secrets.BW_CLIENTID }}
          bw_clientsecret: ${{ secrets.BW_CLIENTSECRET }}
          bw_password: ${{ secrets.BW_PASSWORD }}
          ci_pat: ${{ secrets.CI_PAT }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - env: &apply_env
          BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
          BW_CLIENTSECRET: ${{ secrets.BW_CLIENTSECRET }}
          BW_PASSWORD: ${{ secrets.BW_PASSWORD }}
          SCRIPT: ${{ inputs.script }}
          TF_VAR_GHCR_PAT: ${{ secrets.GHCR_PAT }}
          TF_VARS: ${{ inputs.tf_vars }}
        name: terraform apply (${{ inputs.script }})
        run: &apply_command |
          if [ -n "$TF_VARS" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              export "${line%%=*}=${line#*=}"
            done <<< "$TF_VARS"
          fi
          bash "$SCRIPT"
        working-directory: ${{ inputs.working_directory }}

  plan:
    if: ${{ inputs.plan_only || inputs.label != 'dokploy' }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    runs-on: ubuntu-26.04
    steps:
      - *checkout
      - *setup
      - &host
        name: Render the Production SSH target for Stage 2
        if: ${{ inputs.label == 'dokploy' }}
        working-directory: linode/environments/production
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          terraform init -input=false -backend-config=backend.hcl
          terraform console <<< 'jsonencode(local.dokploy_ssh_config)' | jq -er 'fromjson' > dokploy.sshconfig
      - &plan
        env:
          BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
          BW_CLIENTSECRET: ${{ secrets.BW_CLIENTSECRET }}
          BW_PASSWORD: ${{ secrets.BW_PASSWORD }}
          LABEL: ${{ inputs.label }}
          SCRIPT: ${{ inputs.script }}
          TF_DETECT_CHANGES: "true"
          TF_VAR_GHCR_PAT: ${{ secrets.GHCR_PAT }}
          TF_VARS: ${{ inputs.tf_vars }}
        id: plan
        name: terraform plan (${{ inputs.script }})
        run: |
          if [ -n "$TF_VARS" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              export "${line%%=*}=${line#*=}"
            done <<< "$TF_VARS"
          fi
          set +e
          bash "$SCRIPT" 2>&1 | tee plan.out
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### Terraform plan: ${LABEL}"
            if [ "$rc" = "2" ]; then
              echo "**Changes detected.**"
            elif [ "$rc" = "0" ]; then
              echo "_No changes._"
            fi
            echo
            echo '```'
            tail -c 60000 plan.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = "2" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" = "0" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::terraform plan failed (exit $rc)"
            exit "$rc"
          fi
        working-directory: ${{ inputs.working_directory }}

  dokploy:
    name: Deploy Dokploy
    if: ${{ inputs.label == 'dokploy' && !inputs.plan_only }}
    environment:
      name: dokploy
      url: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/guides/dokploy-recovery.md
    runs-on: ubuntu-26.04
    steps:
      - *checkout
      - *setup
      - *host
      - *plan
      - name: terraform apply (${{ inputs.script }})
        if: ${{ steps.plan.outputs.has_changes == 'true' }}
        env: *apply_env
        run: *apply_command
        working-directory: ${{ inputs.working_directory }}

name: _terraform-apply

on:
  workflow_call:
    inputs:
      label:
        description: Identifier for logs/run-name (e.g. astarte, production).
        required: true
        type: string
      plan_only:
        default: false
        description: Skip the apply job; run only the read-only plan.
        required: false
        type: boolean
      ref:
        default: ""
        description: Git ref/SHA to check out. Empty = the triggering ref.
        required: false
        type: string
      script:
        description: Wrapper script run inside working_directory (e.g. dokploy.sh).
        required: true
        type: string
      tf_vars:
        default: ""
        description: Newline-separated TF_VAR_* assignments (KEY=VALUE per line).
        required: false
        type: string
      working_directory:
        description: TF environment directory (e.g. linode/environments/dokploy).
        required: true
        type: string
  workflow_dispatch:
    inputs:
      label:
        description: Identifier for logs/run-name (e.g. astarte, production).
        required: true
        type: string
      plan_only:
        default: false
        description: Skip the apply job; run only the read-only plan.
        required: false
        type: boolean
      ref:
        default: ""
        description: Git ref/SHA to check out. Empty = the triggering ref.
        required: false
        type: string
      script:
        description: Wrapper script run inside working_directory (e.g. dokploy.sh).
        required: true
        type: string
      tf_vars:
        default: ""
        description: Newline-separated TF_VAR_* assignments (KEY=VALUE per line).
        required: false
        type: string
      working_directory:
        description: TF environment directory (e.g. linode/environments/dokploy).
        required: true
        type: string

permissions:
  contents: read
  deployments: write

run-name: ${{ inputs.plan_only && 'plan' || 'apply' }} ${{ inputs.label }}
