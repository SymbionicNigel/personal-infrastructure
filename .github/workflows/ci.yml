# Single CI orchestrator. One run per push/PR builds only the changed services
# (reusable _astarte/_iris/_timescale_bootstrapped workflows), then the deploy
# jobs `needs` all service jobs -- so a master push deploys exactly once, after
# every build finishes.

# PRs coalesce per-branch (cancel-in-progress). master/dispatch share one
# non-cancellable group; the TF op also serializes on _terraform-apply's lock.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'main' }}

jobs:
  # Build+test each changed service via its reusable workflow. push_image is
  # true off PRs, so PRs validate the image without pushing or touching the
  # <SVC>_IMAGE_TAG variable.
  astarte:
    if: ${{ needs.changes.outputs.astarte == 'true' }}
    needs: changes
    secrets: inherit
    uses: ./.github/workflows/_astarte.yml
    with:
      push_image: ${{ github.event_name != 'pull_request' }}

  # Which services / infra changed. Defaults to 'false' on workflow_dispatch
  # (the filter only runs on PR/push); the deploy gating handles dispatch
  # explicitly. Push needs a checkout for the paths-filter base comparison.
  changes:
    outputs:
      astarte: ${{ steps.filter.outputs.astarte || 'false' }}
      infra: ${{ steps.filter.outputs.infra || 'false' }}
      iris: ${{ steps.filter.outputs.iris || 'false' }}
      timescale_bootstrapped: ${{ steps.filter.outputs.timescale_bootstrapped || 'false' }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v6
      - id: filter
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            astarte:
              - 'astarte/**'
              - '.github/workflows/_astarte.yml'
            infra:
              - '.github/workflows/_terraform-apply.yml'
              - '.github/workflows/ci.yml'
              - '.secrets'
              - 'compose/docker-compose.yml'
              - 'linode/environments/dokploy/**'
              - 'linode/environments/production/**'
              - 'linode/modules/**'
            iris:
              - 'iris/**'
              - '.github/workflows/_iris.yml'
            timescale_bootstrapped:
              - 'postgres/**'
              - '.github/workflows/_timescale_bootstrapped.yml'

  # Single required status check for branch protection. Always runs so it always
  # reports; fails only if a triggered job actually failed/was cancelled.
  ci-gate:
    if: ${{ always() }}
    needs:
      [
        changes,
        astarte,
        iris,
        timescale_bootstrapped,
        collect,
        prod,
        dokploy,
        typegen,
      ]
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A triggered job failed: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: |
          echo "ok: ${{ join(needs.*.result, ', ') }}"

  # Gather every <SVC>_IMAGE_TAG repo Variable into TF_VAR_* lines. needs the
  # service jobs so just-built tags are already recorded when read.
  collect:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (needs.changes.outputs.infra == 'true' || needs.changes.outputs.astarte == 'true' || needs.changes.outputs.iris == 'true' || needs.changes.outputs.timescale_bootstrapped == 'true')) || (github.event_name == 'pull_request' && needs.changes.outputs.infra == 'true' && github.actor != 'dependabot[bot]')) }}
    needs: [changes, astarte, iris, timescale_bootstrapped]
    outputs:
      tf_vars: ${{ steps.tags.outputs.tf_vars }}
    runs-on: ubuntu-latest
    steps:
      - env:
          ASTARTE_CHANGED: ${{ needs.changes.outputs.astarte }}
          GH_TOKEN: ${{ secrets.CI_PAT }}
          IRIS_CHANGED: ${{ needs.changes.outputs.iris }}
          TIMESCALE_BOOTSTRAPPED_CHANGED: ${{ needs.changes.outputs.timescale_bootstrapped }}
        id: tags
        name: Collect service image tags
        run: |
          {
            echo "tf_vars<<TFVARS_EOF"
            # Base: current deployed tags for every service (unchanged ones use these).
            gh variable list --repo "${GITHUB_REPOSITORY}" --json name,value \
              --jq '.[] | select(.name | endswith("_IMAGE_TAG")) | "TF_VAR_\(.name)=\(.value)"' || true
            # Changed services: override with the commit SHA their build tags the
            # image with (appended last -> wins in the export loop), so the
            # dokploy PR plan reflects the image update a merge would make. No-op
            # on push, where it equals the just-recorded variable.
            [ "${ASTARTE_CHANGED}" = "true" ] && echo "TF_VAR_ASTARTE_IMAGE_TAG=${GITHUB_SHA}"
            [ "${IRIS_CHANGED}" = "true" ] && echo "TF_VAR_IRIS_IMAGE_TAG=${GITHUB_SHA}"
            [ "${TIMESCALE_BOOTSTRAPPED_CHANGED}" = "true" ] && echo "TF_VAR_TIMESCALE_BOOTSTRAPPED_IMAGE_TAG=${GITHUB_SHA}"
            echo "TFVARS_EOF"
          } >> "$GITHUB_OUTPUT"

  # Render + deploy the compose stack from the collected tags, after the host
  # converges. Gated on collect (which carries the event/change conditions);
  # prod stays in needs only for ordering. Keying on prod via the default
  # success() gate would wrongly skip this whenever prod's terminal apply job is
  # skipped (every PR under plan_only, and any no-op apply on push).
  dokploy:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.collect.result == 'success' }}
    needs: [collect, prod]
    secrets: inherit
    uses: ./.github/workflows/_terraform-apply.yml
    with:
      label: dokploy
      plan_only: ${{ github.event_name == 'pull_request' }}
      script: dokploy.sh
      tf_vars: ${{ needs.collect.outputs.tf_vars }}
      working_directory: linode/environments/dokploy

  iris:
    if: ${{ needs.changes.outputs.iris == 'true' }}
    needs: changes
    secrets: inherit
    uses: ./.github/workflows/_iris.yml
    with:
      push_image: ${{ github.event_name != 'pull_request' }}

  # Provision/converge the host. Runs after all service builds; skipped (not
  # failed) builds are fine, a failed build blocks the deploy. plan_only on PRs.
  prod:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (needs.changes.outputs.infra == 'true' || needs.changes.outputs.astarte == 'true' || needs.changes.outputs.iris == 'true' || needs.changes.outputs.timescale_bootstrapped == 'true')) || (github.event_name == 'pull_request' && needs.changes.outputs.infra == 'true' && github.actor != 'dependabot[bot]')) }}
    needs: [changes, astarte, iris, timescale_bootstrapped]
    secrets: inherit
    uses: ./.github/workflows/_terraform-apply.yml
    with:
      label: production
      plan_only: ${{ github.event_name == 'pull_request' }}
      script: production.sh
      working_directory: linode/environments/production

  timescale_bootstrapped:
    if: ${{ needs.changes.outputs.timescale_bootstrapped == 'true' }}
    needs: changes
    secrets: inherit
    uses: ./.github/workflows/_timescale_bootstrapped.yml
    with:
      push_image: ${{ github.event_name != 'pull_request' }}

  # Regenerates iris/app/generated/{api.d.ts,schema,relations}.ts and
  # astarte/openapi.json, then fails on `git diff --exit-code`. See
  # astarte/README.md and iris/README.md for the generators and fix-up steps.
  #
  # The postgres service container is the vanilla timescale image (not the
  # repo's timescale-bootstrapped image — that may be building in the same CI
  # run, and the service-containers feature can't depend on jobs). The
  # reconcile-roles step below substitutes for the entrypoint wrapper, applying
  # the same SQL against the vanilla container so astarte and drizzle-kit see
  # a properly provisioned DB.
  typegen:
    env:
      POSTGRES_ASTARTE_PASSWORD: ci-astarte
      POSTGRES_ASTARTE_USER: astarte
      POSTGRES_DB: app
      POSTGRES_HOST: localhost
      POSTGRES_IRIS_RO_PASSWORD: ci-iris-ro
      POSTGRES_PASSWORD: ci-superuser
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ci_root
    if: ${{ needs.changes.outputs.astarte == 'true' || needs.changes.outputs.iris == 'true' || needs.changes.outputs.timescale_bootstrapped == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: ci-superuser
          POSTGRES_USER: ci_root
        image: timescale/timescaledb:latest-pg17
        options: >-
          --health-cmd "pg_isready -U ci_root -d app"
          --health-interval 5s
          --health-retries 10
          --health-timeout 3s
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6

      - env:
          PGPASSWORD: ci-superuser
        name: Apply reconcile-roles.sql against the service container
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql --host=localhost --username=ci_root --dbname=app \
            --set=ON_ERROR_STOP=1 \
            --set=astarte_password="ci-astarte" \
            --set=iris_ro_password="ci-iris-ro" \
            --file=postgres/scripts/reconcile-roles.sql

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install astarte deps
        run: uv sync --frozen
        working-directory: astarte

      - name: Migrate astarte DB
        run: uv run python scripts/migrate.py
        working-directory: astarte

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: iris/package.json

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: iris/pnpm-lock.yaml
          node-version: 24

      - name: Install iris deps
        run: pnpm install --frozen-lockfile
        working-directory: iris

      - env:
          DATABASE_URL: postgresql://iris_ro:ci-iris-ro@localhost:5432/app
        name: Regenerate iris/app/generated/{schema,relations}.ts
        run: pnpm typegen:db
        working-directory: iris

      - name: Fail if drizzle artifacts drift from committed copies
        run: |
          if ! git diff --exit-code -- \
              iris/app/generated/schema.ts \
              iris/app/generated/relations.ts; then
            echo "::error::iris drizzle artifacts differ from committed copies."
            echo "::error::Run \`pnpm -C iris typegen:db\` against a migrated astarte DB and commit."
            exit 1
          fi

name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  packages: write
  pull-requests: read
