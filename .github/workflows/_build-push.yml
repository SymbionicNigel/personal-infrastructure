# Reusable build + push of a service image to GHCR, recording the built SHA as a
# repo Variable so the deploy orchestrator can render the full compose.
# Required repo secret: CI_PAT (this repo Variables: Read and write).

concurrency:
  cancel-in-progress: false
  group: build-${{ inputs.service }}-${{ github.ref }}

jobs:
  build:
    outputs:
      image_tag: ${{ github.sha }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - env:
          IMAGE_NAME: ${{ inputs.image_name }}
          SERVICE: ${{ inputs.service }}
        id: meta
        name: Compute lowercased image ref
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="$IMAGE_NAME"
          [ -n "$image" ] || image="$SERVICE"
          echo "image=ghcr.io/${owner}/${image,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Login only when we intend to push. PR validation builds the image to
      # catch Dockerfile/packaging breakage but pushes nothing.
      - if: ${{ inputs.push_image }}
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
          context: ${{ inputs.context }}
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest

      - env:
          IMAGE: ${{ steps.meta.outputs.image }}
          SCAN_EXIT_CODE: ${{ inputs.service == 'timescale_bootstrapped' && '0' || '1' }}
        name: Scan image (${{ inputs.service == 'timescale_bootstrapped' && 'report-only' || 'blocking' }})
        run: |
          mkdir -p "$RUNNER_TEMP/security-scans"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$RUNNER_TEMP/security-scans:/reports" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code "$SCAN_EXIT_CODE" \
            --image-src docker --format json --output /reports/image.json "$IMAGE:$GITHUB_SHA"

      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-${{ inputs.service }}
          path: ${{ runner.temp }}/security-scans/

      - env:
          IMAGE: ${{ steps.meta.outputs.image }}
        if: ${{ inputs.push_image }}
        name: Publish scanned image
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      # GITHUB_TOKEN can't manage Variables, so use CI_PAT. The orchestrator
      # reads every *_IMAGE_TAG variable. Skipped on no-push (PR) builds.
      - env:
          GH_TOKEN: ${{ secrets.CI_PAT }}
          SERVICE: ${{ inputs.service }}
        if: ${{ inputs.push_image }}
        name: Record image tag variable
        run: gh variable set "${SERVICE^^}_IMAGE_TAG" --repo "${GITHUB_REPOSITORY}" --body "${GITHUB_SHA}"

name: _build-push

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context directory (e.g. astarte).
        required: true
        type: string
      image_name:
        default: ""
        description: GHCR image name (lowercased). Defaults to `service`.
        required: false
        type: string
      push_image:
        default: true
        description: Push to GHCR + record the tag Variable. False = build-only validation (PRs).
        required: false
        type: boolean
      service:
        description: Service id; uppercased -> <SVC>_IMAGE_TAG repo Variable.
        required: true
        type: string
    outputs:
      image_tag:
        description: Commit SHA the image was tagged with.
        value: ${{ jobs.build.outputs.image_tag }}
