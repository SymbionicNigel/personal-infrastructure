# One build at a time per ref (queued, not cancelled) so concurrent pushes
# don't race to set IRIS_IMAGE_TAG / push :latest out of order.
concurrency:
  cancel-in-progress: false
  group: iris-${{ github.ref }}

jobs:
  # Build the image via the reusable workflow. On master it also pushes to GHCR
  # and records IRIS_IMAGE_TAG; deploys then flow through deploy.yml
  # (workflow_run after this build). On pull_request push_image is false: the
  # image is built for validation but not pushed, and the Variable isn't touched.
  build-and-push:
    if: ${{ needs.changes.outputs.iris == 'true' }}
    needs: [changes, test]
    secrets: inherit
    uses: ./.github/workflows/_build-push.yml
    with:
      context: iris
      push_image: ${{ github.event_name != 'pull_request' }}
      service: iris

  # Detect whether iris's own code/build config changed. On non-PR events the
  # filter is skipped and defaults to true (push/dispatch always do the work).
  # Lets the workflow trigger on every PR while the real jobs skip when iris/ is
  # untouched -- so the required iris-gate never deadlocks an unrelated PR.
  changes:
    outputs:
      iris: ${{ steps.filter.outputs.iris || 'true' }}
    runs-on: ubuntu-latest
    steps:
      - id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            iris:
              - 'iris/**'
              - '.github/workflows/iris.yml'

  # Single required status check for branch protection. Always runs (even when
  # test/build skipped) so it always reports, and fails only if a triggered job
  # actually failed -- an unrelated PR (test/build skipped) passes it, a broken
  # service PR blocks. skipped/cancelled are not failures.
  iris-gate:
    if: ${{ always() }}
    needs: [changes, test, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A triggered job failed: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: |
          echo "ok: ${{ join(needs.*.result, ', ') }}"

  test:
    defaults:
      run:
        working-directory: iris
    if: ${{ needs.changes.outputs.iris == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: iris/package.json

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: iris/pnpm-lock.yaml
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # Fail the build if any prod dependency ships under a non-permissive
      # license. The repo is Apache-2.0; copyleft (GPL/AGPL) and source-available
      # (SSPL/BUSL) deps would create distribution conflicts.
      - name: license audit
        run: >
          pnpm dlx license-checker-rseidelsohn --production --excludePrivatePackages
          --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;ISC;Unlicense;MPL-2.0;CC0-1.0;Python-2.0'

name: iris

on:
  # Runs on every PR so the required iris-gate always reports; the `changes` job
  # + per-job `if` skip the real work when iris/ is untouched. Push stays
  # path-filtered: master only rebuilds/pushes when the service actually changes.
  pull_request:
  push:
    branches: [master]
    paths:
      - 'iris/**'
      - '.github/workflows/iris.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read
