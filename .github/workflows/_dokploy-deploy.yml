# Reusable Terraform deploy for any Dokploy-hosted service. Per-service
# workflows call it via `uses:` + `secrets: inherit`; it is also dispatchable
# manually for validation/back-out.
#
# Required repo secrets (reached via `secrets: inherit` on workflow_call, or
# directly on workflow_dispatch):
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE  - decrypt chezmoi-managed secrets
#   BW_CLIENTID, BW_CLIENTSECRET, BW_PASSWORD - non-interactive Bitwarden unlock

# Serialize every Dokploy TF apply so concurrent service deploys queue rather
# than race the shared S3 state lock.
concurrency:
  cancel-in-progress: false
  group: dokploy-tf-apply

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Submodules include .secrets/ (encrypted via chezmoi/GPG) and
      # dotfile-utils/ (install + bitwarden scripts).
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # gh is preinstalled on ubuntu-latest; GH_TOKEN authenticates it so the
      # installer's `gh release` lookups work.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Install Bitwarden CLI
        run: bash dotfile-utils/scripts/install_bw_cli.sh

      # CI mode: skip fork/release management, read the pinned version from the
      # owner's public fork. Add ~/.local/bin to PATH for later steps.
      - env:
          CHEZMOI_FORK_USER: ${{ github.repository_owner }}
          CI: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Install chezmoi
        run: |
          bash dotfile-utils/scripts/install_chezmoi.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Bitwarden unlock + chezmoi apply in one shell so BW_SESSION (exported by
      # the sourced script) is consumed in-process and never traverses
      # $GITHUB_ENV. --no-tty makes any unexpected prompt fail fast instead of
      # hanging the runner. Materializes compose/.env.prod,
      # linode/environments/dokploy/.env, and .../backend.hcl.
      - env:
          BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
          BW_CLIENTSECRET: ${{ secrets.BW_CLIENTSECRET }}
          BW_PASSWORD: ${{ secrets.BW_PASSWORD }}
        name: chezmoi apply (Bitwarden-unlocked)
        run: |
          source dotfile-utils/scripts/source_bitwarden_session.sh
          chezmoi apply --no-tty --config ./.chezmoi.toml

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Source the decrypted .env in the same shell as terraform so creds
      # (AWS_*, TF_VAR_DOKPLOY_API_KEY, TF_VAR_HOSTNAME_TLD) stay step-scoped.
      # The image tag is injected into the caller-named TF_VAR_*.
      - env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          TF_VAR_NAME: ${{ inputs.tf_var_name }}
        name: terraform apply
        run: |
          set -a
          # shellcheck disable=SC1091
          source ./.env
          set +a
          export "TF_VAR_${TF_VAR_NAME}=${IMAGE_TAG}"
          terraform init -backend-config=backend.hcl
          terraform apply -input=false -auto-approve
        working-directory: linode/environments/dokploy

name: _dokploy-deploy

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag (commit SHA) to pin in Terraform.
        required: true
        type: string
      service_name:
        description: Service being deployed (identification/logs).
        required: true
        type: string
      tf_var_name:
        description: TF_VAR_* name set to image_tag (e.g. ASTARTE_IMAGE_TAG).
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (commit SHA) to pin in Terraform.
        required: true
        type: string
      service_name:
        description: Service being deployed (identification/logs).
        required: true
        type: string
      tf_var_name:
        description: TF_VAR_* name set to image_tag (e.g. ASTARTE_IMAGE_TAG).
        required: true
        type: string

permissions:
  contents: read

run-name: deploy ${{ inputs.service_name }} (${{ inputs.image_tag }})
