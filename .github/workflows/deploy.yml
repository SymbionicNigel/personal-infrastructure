# Ordered deploy pipeline: production apply -> dokploy apply, so the host (and
# its GHCR login) always converges before the service stack deploys onto it.
# A failed prod step skips dokploy (never deploy onto an unconverged host).
#
# plan_only is on for pull_request events: PRs run `terraform plan` for both
# envs (read-only validation, no mutations); push/workflow_run/dispatch apply.
# The dokploy stage renders the full compose from every <SVC>_IMAGE_TAG repo
# Variable, so one service's deploy never reverts another's pinned tag.

# PR plans coalesce per-branch (cancel-in-progress) under their own group; apply
# runs share a single non-cancellable group so a new run can never abort an
# in-flight apply. Either way the actual TF op also serializes on the reusable
# workflow's linode-tf-apply lock.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: deploy-${{ github.event_name == 'pull_request' && format('plan-{0}', github.ref) || 'apply' }}

jobs:
  # Detect what changed so the plan jobs can gate correctly. `infra` defaults to
  # true on non-PR/push events (workflow_run/dispatch always apply). `astarte`
  # is used to dedupe: a master push that also touched astarte/ is left to the
  # workflow_run-triggered deploy (which waits for the rebuilt image), so it
  # doesn't apply twice. Runs on every PR so the required deploy-gate always
  # reports while the plan jobs skip when no infra changed.
  changes:
    outputs:
      astarte: ${{ steps.filter.outputs.astarte || 'false' }}
      infra: ${{ steps.filter.outputs.infra || 'true' }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v6
      - id: filter
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            astarte:
              - 'astarte/**'
            infra:
              - '.github/workflows/_terraform-apply.yml'
              - '.github/workflows/deploy.yml'
              - '.secrets'
              - 'compose/docker-compose.yml'
              - 'linode/environments/dokploy/**'
              - 'linode/environments/production/**'
              - 'linode/modules/**'

  # Gated to skip when: a PR didn't touch infra; a PR is from Dependabot (its
  # runs have no CI_PAT, so the plan can't read Variables or the private
  # submodule -- review those by hand); or a push also changed astarte/ (the
  # workflow_run deploy handles it, avoiding a double apply).
  collect:
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'pull_request' || (needs.changes.outputs.infra == 'true' && github.actor != 'dependabot[bot]')) && !(github.event_name == 'push' && needs.changes.outputs.astarte == 'true') }}
    needs: changes
    outputs:
      tf_vars: ${{ steps.tags.outputs.tf_vars }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.CI_PAT }}
        id: tags
        name: Collect service image tags
        run: |
          {
            echo "tf_vars<<TFVARS_EOF"
            gh variable list --repo "${GITHUB_REPOSITORY}" --json name,value \
              --jq '.[] | select(.name | endswith("_IMAGE_TAG")) | "TF_VAR_\(.name)=\(.value)"' || true
            echo "TFVARS_EOF"
          } >> "$GITHUB_OUTPUT"

  # Single required status check for branch protection. Always runs (even when
  # the plan jobs skip) so it always reports, and fails only if a triggered job
  # actually failed -- an unrelated PR (plans skipped) passes it, a broken plan
  # blocks. skipped/cancelled are not failures.
  deploy-gate:
    if: ${{ always() }}
    needs: [changes, collect, prod, dokploy]
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A triggered job failed: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: |
          echo "ok: ${{ join(needs.*.result, ', ') }}"

  dokploy:
    needs: [collect, prod]
    secrets: inherit
    uses: ./.github/workflows/_terraform-apply.yml
    with:
      label: dokploy
      plan_only: ${{ github.event_name == 'pull_request' }}
      ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      script: dokploy.sh
      tf_vars: ${{ needs.collect.outputs.tf_vars }}
      working_directory: linode/environments/dokploy

  prod:
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'pull_request' || (needs.changes.outputs.infra == 'true' && github.actor != 'dependabot[bot]')) && !(github.event_name == 'push' && needs.changes.outputs.astarte == 'true') }}
    needs: changes
    secrets: inherit
    uses: ./.github/workflows/_terraform-apply.yml
    with:
      label: production
      plan_only: ${{ github.event_name == 'pull_request' }}
      ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      script: production.sh
      working_directory: linode/environments/production

name: deploy

on:
  # Runs on every PR so the required deploy-gate always reports; the `changes`
  # job + per-job `if` skip the plan when no infra path changed. Push stays
  # path-filtered: master only applies when infra/deploy-config actually changes.
  pull_request:
  push:
    branches: [master]
    paths:
      - .github/workflows/_terraform-apply.yml
      - .github/workflows/deploy.yml
      - .secrets
      - compose/docker-compose.yml
      - linode/environments/dokploy/**
      - linode/environments/production/**
      - linode/modules/**
  workflow_dispatch:
  workflow_run:
    branches: [master]
    types: [completed]
    workflows: [astarte]

permissions:
  contents: read
  pull-requests: read
